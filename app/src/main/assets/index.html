<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>微记 · 个人记录</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-8H9v8H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h17M9 16v-5M14 16V6M19 16v-8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.7 3.8a1 1 0 0 1 1-.8h2.6a1 1 0 0 1 1 .8l.3 1.7 1.5.9 1.6-.6a1 1 0 0 1 1.2.4l1.3 2.3a1 1 0 0 1-.2 1.3l-1.3 1.1v1.8l1.3 1.1a1 1 0 0 1 .2 1.3l-1.3 2.3a1 1 0 0 1-1.2.4l-1.6-.6-1.5.9-.3 1.7a1 1 0 0 1-1 .8h-2.6a1 1 0 0 1-1-.8l-.3-1.7-1.5-.9-1.6.6a1 1 0 0 1-1.2-.4l-1.3-2.3a1 1 0 0 1 .2-1.3l1.3-1.1v-1.8L4 10.1a1 1 0 0 1-.2-1.3l1.3-2.3a1 1 0 0 1 1.2-.4l1.6.6 1.5-.9z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 3h8l10 10-8 8L3 11z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2.5 2.5 0 0 0-4-4L5 15z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 4C8 2 3 7 5 14s14 8 14-10ZM5 21c0-7 5-11 10-13"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <div id="demo-banner" class="demo-banner" hidden>示例预览 · 这些是演示数据 <button id="exit-demo">开始空白记录</button></div>
    <header class="app-header">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span><span><strong>微记</strong><small>属于自己的小记录</small></span></div>
      <span class="header-privacy"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>本地 · 私密</span>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <span class="nav-selection" aria-hidden="true"></span>
      <button data-page="home" class="nav-item active"><svg class="icon"><use href="#i-home"/></svg><span>本周</span></button>
      <button data-page="records" class="nav-item"><svg class="icon"><use href="#i-list"/></svg><span>记录</span></button>
      <button class="add-button nav-create" data-action="add" aria-label="添加记录"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button data-page="stats" class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>偏好</span></button>
      <button class="nav-item nav-settings" data-page="settings" data-action="settings" aria-label="设置"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" class="toast" hidden></div>
  <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
