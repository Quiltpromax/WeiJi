  <script>(function () {
  "use strict";
  var key = "weiji-appearance-v1";
  var native = window.WeijiNative;
  var media = window.matchMedia("(prefers-color-scheme: dark)");
  var labels = { system: "跟随系统", light: "浅色", dark: "深色" };

    if (Object.prototype.hasOwnProperty.call(labels, saved)) mode = saved;

    } catch (_) {}

    try {
      if (native && native.setTheme) native.setTheme(mode);
    } catch (_) {}

    getMode: function () { return mode; },
    getLabel: function () { return labels[mode]; },
    refresh: refresh,
    setMode: function (value) {
      if (!Object.prototype.hasOwnProperty.call(labels, value)) return false;
      try {
        if (native && native.setTheme) native.setTheme(value);
        else localStorage.setItem(key, value);
      } catch (_) { return false; }

      refresh();
      return true;
    }
  };

.sheet-heading .icon-button { width:32px; height:32px; border-radius:50%; background:var(--green-light); color:var(--green); }
.sheet-heading .icon-button .icon { width:17px; height:17px; stroke-width:2; }
.sheet-handle { width:35px; height:5px; margin-bottom:22px; opacity:.8; }
.appearance-options button { min-height:43px; }
.appearance-note { font-size:12px; line-height:1.95; }
.toast { border-radius:18px; bottom:114px; bottom:calc(114px + env(safe-area-inset-bottom,0px)); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.timer-floating { bottom:102px; bottom:calc(102px + env(safe-area-inset-bottom,0px)); border-radius:16px; }
button { touch-action:manipulation; -webkit-user-select:none; user-select:none; transition:transform 180ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease,background-color 180ms ease,box-shadow 180ms ease; }
button:active,button.is-pressed { transform:scale(.96); opacity:.78; }
.bottom-nav button:active,.bottom-nav button.is-pressed { transform:scale(.91); opacity:.8; }
.timer-floating:active,.timer-floating.is-pressed { transform:translateX(-50%) scale(.96); }
.settings-row:active,.settings-row.is-pressed { background:var(--press-tint); border-radius:12px; }
button:disabled:active { transform:none; }
button:focus-visible { outline:3px solid var(--green); outline-offset:3px; }
.page-enter { animation:page-enter 240ms cubic-bezier(.2,.8,.2,1) both; }
.sheet { animation:sheet-enter 280ms cubic-bezier(.16,1,.3,1) both; }
.sheet.no-entrance { animation:none; }
.modal-backdrop { animation:backdrop-enter 180ms ease both; }
.modal-backdrop.no-entrance { animation:none; }
@keyframes page-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes sheet-enter { from { opacity:.6; transform:translateY(28px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes backdrop-enter { from { opacity:0; } to { opacity:1; } }
@media(min-width:600px) {
  .bottom-nav { bottom:40px; }
  .sheet { border-radius:30px; }
  .toast { bottom:142px; }
  .timer-floating { bottom:130px; }
}
@media(max-width:359px) {
  .app-header { padding-inline:17px; }
  #main { padding-inline:16px; }
  .header-privacy { font-size:9px; padding:6px 8px; }
  .home-intro .page-heading { font-size:20px; }
  .week-label { gap:4px; font-size:10px; }
  .week-label strong { font-size:11px; }
  .week-controls button { width:28px; height:28px; }
  .metric-card { padding:17px 13px; }
  .record-trailing { font-size:9px; }
  .bottom-nav { width:calc(100% - 20px); padding-inline:6px; gap:1px; }
  .bottom-nav .nav-create { width:46px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
  button:active,button.is-pressed,.bottom-nav button:active,.bottom-nav button.is-pressed { transform:none; opacity:.7; }
  .timer-floating:active,.timer-floating.is-pressed { transform:translateX(-50%); }
}

/* Fixed top chrome; only the journal content moves beneath it. */
:root {
  --topbar-height:88px;
  --topbar-bg:rgba(247,248,245,.94);
  --topbar-line:rgba(45,72,54,.08);
  --dock-bg:rgba(255,255,255,.62);
  --dock-border:rgba(255,255,255,.55);
}
:root[data-theme="dark"] {
  --topbar-bg:rgba(21,28,25,.94);
  --topbar-line:rgba(180,207,188,.1);
  --dock-bg:rgba(30,40,34,.58);
  --dock-border:rgba(180,207,188,.12);
}
.app-shell {
  padding-top:var(--topbar-height);
  padding-top:calc(var(--topbar-height) + env(safe-area-inset-top,0px));
  overflow:hidden;
}
.app-header {
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:var(--topbar-height);
  height:calc(var(--topbar-height) + env(safe-area-inset-top,0px));
  padding:16px 22px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  z-index:40; background:var(--topbar-bg); border-bottom:1px solid var(--topbar-line);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  backdrop-filter:blur(20px) saturate(130%);
}
#main { position:relative; animation:none; }
.page-transition-layer {
  position:fixed; bottom:0; overflow:hidden; z-index:2;
  pointer-events:none; contain:layout paint;
}
.page-snapshot { position:absolute; margin:0; pointer-events:none; }
.bottom-nav { z-index:40; }
.bottom-nav .nav-selection {
  position:absolute; top:7px; left:0; height:60px; border-radius:20px;
  background:var(--press-tint); box-shadow:inset 0 1px 0 #ffffff08;
  pointer-events:none; opacity:0; will-change:transform;
}
.bottom-nav .nav-selection.is-ready {
  transition:transform 420ms cubic-bezier(.22,.8,.2,1),width 420ms cubic-bezier(.22,.8,.2,1),opacity 260ms ease;
}
.bottom-nav .nav-item { z-index:1; transition:color 320ms ease,transform 240ms cubic-bezier(.2,.8,.2,1),opacity 220ms ease; }
.bottom-nav .nav-item.active { background:transparent; }
.bottom-nav .nav-item .icon { transition:transform 360ms cubic-bezier(.22,.8,.2,1),stroke-width 320ms ease; }
.bottom-nav .nav-item span { opacity:.8; transition:opacity 320ms ease; }
.bottom-nav .nav-item.active .icon { transform:translateY(-1px); }
.bottom-nav .nav-item.active span { opacity:1; }
.bottom-nav .nav-create { position:relative; z-index:2; }
.sheet { animation-duration:360ms; }
.modal-backdrop { animation-duration:260ms; }
@media(min-width:600px) {
  .app-header { top:28px; border-radius:30px 30px 0 0; }
}
@media(max-width:359px) {
  .app-header { padding-inline:17px; }
}
@media(prefers-reduced-motion:reduce) {
  .bottom-nav .nav-selection.is-ready,.bottom-nav .nav-item,.bottom-nav .nav-item .icon,.bottom-nav .nav-item span { transition:none; }
  .bottom-nav .nav-item.active .icon { transform:none; }
}
